<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Forms</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .form-container {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #fff;
            box-shadow: 0 2px 4px 2px  rgb(55, 4, 194);
            display: none; /* Hidden by default */
        }
        .form-title {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .toggle-button {
            cursor: pointer;
            color: blue;
            text-decoration: underline;
            margin: 10px 0;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="toggle-button" id="businessNav">Business Inquiry</div>
    <div class="form-container" id="businessForm">
        <div class="form-title">Business Inquiry Form</div>
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <label for="businessName">Your Name:</label>
            <input type="text" id="businessName" name="businessName" required>
            <label for="businessEmail">Your Email:</label>
            <input type="email" id="businessEmail" name="businessEmail" required>
            <label for="businessMessage">Message:</label>
            <textarea id="businessMessage" name="businessMessage" rows="4" required></textarea>
            <button type="submit">Send</button>
        </form>
    </div>

    <div class="toggle-button" id="commentNav">Leave a Comment</div>
    <div class="form-container" id="commentForm">
        <div class="form-title">Comment Form</div>
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
            <label for="commentMessage">Message:</label>
            <textarea id="commentMessage" name="commentMessage" rows="4" required></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        const businessNav = document.getElementById('businessNav');
        const businessForm = document.getElementById('businessForm');
        const commentNav = document.getElementById('commentNav');
        const commentForm = document.getElementById('commentForm');

        businessNav.addEventListener('click', () => {
            businessForm.style.display = businessForm.style.display === 'none' || businessForm.style.display === '' ? 'block' : 'none';
            commentForm.style.display = 'none'; // Hide comment form
        });

        commentNav.addEventListener('click', () => {
            commentForm.style.display = commentForm.style.display === 'none' || commentForm.style.display === '' ? 'block' : 'none';
            businessForm.style.display = 'none'; // Hide business form
        });
    </script>

</body>
</html>
